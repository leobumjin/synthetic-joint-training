[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "synthetic-joint-training"
version = "0.1.0"
description = "Reproducible benchmark-to-synthetic sequential LoRA experiments"
requires-python = ">=3.11,<3.13"
dependencies = ["tqdm>=4.66,<5"]

[project.optional-dependencies]
data = ["huggingface-hub==0.36.0", "pyarrow==21.0.0"]
train = ["torch==2.8.0", "transformers==4.57.6", "peft==0.17.1", "accelerate==1.10.1", "datasets==4.3.0"]
vllm = ["vllm==0.11.0", "transformers==4.57.6", "torch==2.8.0"]
dev = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
